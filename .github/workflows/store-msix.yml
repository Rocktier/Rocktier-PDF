name: Store MSIX (Microsoft Store)

# 只在需要出商店提交包时手动触发（Actions → Run workflow）。
#
# 为什么不复用 release.yml 的 Windows job：那个 job 里 MSIX 与 msi/nsis 共用
# 同一个 src-tauri/target，ROCKTIER_CHANNEL 是 option_env! 的编译期常量，
# cargo 不因环境变量变化重编，商店包会静默复用直链二进制（带自研试用墙）。
# 独立 runner + job 级 env 是物理隔离，不依赖 Cargo 是否检测到环境变量变化。
#
# 与 release.yml 的关系：
#   release.yml → 直链渠道（msi / nsis / msix），带自研试用墙
#   本文件      → 商店渠道（msix / msixbundle），无试用墙

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-store-msix:
    name: Build Microsoft Store MSIX (store channel)
    runs-on: windows-latest
    env:
      ROCKTIER_CHANNEL: store
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          # tauri-windows-bundle builds with an explicit --target, so it has to
          # be present or the MSIX step fails.
          targets: x86_64-pc-windows-msvc

      # pwsh 而非 job 级默认 bash：postinstall 的 fetch-pdfium.mjs 用 `tar -xzf`
      # 解压，Git Bash 的 PATH 会把 GNU tar 顶到前面，它把 `C:\...` 当成远程主机
      # 报 "Cannot connect to C: resolve failed"。pwsh 下 npm 的 cmd 找到的是
      # System32 的 bsdtar，与 release.yml 行为一致。
      - name: Install frontend deps
        shell: pwsh
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version-file: sign-engine/go.mod
          cache-dependency-path: sign-engine/go.sum

      # tauri_build::build() hard-fails when a path in bundle.resources is missing,
      # so both sidecars must exist before the bundle build starts.
      - name: Provision sign-engine sidecar
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File scripts/provision-sign-engine-windows.ps1

      - name: Provision qpdf sidecar
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File scripts/provision-qpdf-windows.ps1

      - name: Verify sign-engine sidecar
        run: |
          set -euo pipefail
          ENGINE=$(find src-tauri/resources/sign-engine -name 'sign-engine-windows.exe' -type f | head -1)
          [ -z "$ENGINE" ] && { echo "::error::sign-engine-windows.exe was not built"; exit 1; }
          # 不能用 `| tee /dev/stderr`：Git Bash 没有 /dev/stderr，tee 报错叠加
          # pipefail 会让本该通过的验证判红 —— 2026-10-29 v1.1.0 首次发版就这么栽的。
          OUTPUT=$(file "$ENGINE")
          echo "$OUTPUT"
          printf '%s\n' "$OUTPUT" | grep -q 'PE32+'
          printf '%s\n' "$OUTPUT" | grep -q 'x86-64'

      - name: Assert store channel
        run: |
          test "${ROCKTIER_CHANNEL}" = "store" || {
            echo "::error::ROCKTIER_CHANNEL is not store - refusing to build"; exit 1; }
          echo "ROCKTIER_CHANNEL=${ROCKTIER_CHANNEL}"

      # 商店拒绝占位磁贴（10.1.1.11）。Assets 提交在仓内，这里只防「文件在但图是
      # 纯色占位」——OCR 首包里出过 554 bytes 的纯黑宽磁贴。
      - name: Assert store tiles are real art
        run: |
          set -euo pipefail
          for f in StoreLogo Square44x44Logo Square150x150Logo Wide310x150Logo; do
            p="src-tauri/gen/windows/Assets/$f.png"
            test -f "$p" || { echo "::error::missing tile $p"; exit 1; }
            size=$(wc -c < "$p")
            test "$size" -gt 1000 || {
              echo "::error::tile $f looks like a placeholder ($size bytes)"; exit 1; }
            echo "  $f ${size} bytes"
          done

      - name: Build MSIX (store channel)
        run: npx tauri-windows-bundle build --runner npm --verbose

      - name: Verify store package
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # 不吞错误：产物找不到就让 CI 红，不静默上传空目录。
          find src-tauri/target/msix -maxdepth 1 \( -name '*.msix' -o -name '*.msixbundle' \) \
            -exec cp {} artifacts/ \;
          test "$(find artifacts -name '*.msix*' | wc -l)" -gt 0 || {
            echo "::error::no MSIX produced"; exit 1; }

          # 从真实包内读清单（不是只看生成物），核对身份与能力声明。
          pkg=$(find artifacts -name '*.msix' -not -name '*.msixbundle' | head -1)
          test -n "$pkg" || { echo "::error::no .msix (only bundle?)"; exit 1; }
          unzip -p "$pkg" AppxManifest.xml > artifacts/AppxManifest.xml

          grep -Fq 'Name="Rocktier.RocktierPDF"' artifacts/AppxManifest.xml || {
            echo "::error::Identity Name mismatch"; exit 1; }
          grep -Fq 'Publisher="CN=4EA39D7A-401B-4D56-98D0-8ECB1F2B8DF7"' artifacts/AppxManifest.xml || {
            echo "::error::Publisher mismatch"; exit 1; }
          grep -Fq 'Capability Name="runFullTrust"' artifacts/AppxManifest.xml || {
            echo "::error::runFullTrust missing"; exit 1; }
          if grep -Fq 'internetClient' artifacts/AppxManifest.xml; then
            echo "::error::unexpected internetClient capability"; exit 1; fi

          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          grep -Fq "Version=\"${VERSION}.0\"" artifacts/AppxManifest.xml || {
            echo "::error::Version mismatch (expected ${VERSION}.0)"; exit 1; }

          printf 'ROCKTIER_CHANNEL=store\nIdentity Name=Rocktier.RocktierPDF\n' \
            > artifacts/STORE-CHANNEL.txt
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: RocktierPDF-store-msix
          path: artifacts/*
          if-no-files-found: error
