name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Rust checks
    # macOS, not ubuntu: cargo check/test build the Tauri crate, which on Linux
    # needs glib/gtk/webkit system libraries a bare runner does not have. The
    # family already hit this on the Markdown app's checks job.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 直链版没有验签公钥 ⇒ **谁都激活不了**：`/api/activate` 签出的回执必须由应用
      # 用公钥验签，公钥为空时每一份回执都会失败。把这个包发到已经在收钱的店里，是
      # 最坏的一种安静故障，所以在这里拒绝。
      #
      # 两条出路，都要刻意选择：① 在 Vercel 设好 `LICENSE_PRIVATE_KEY`、并把配对的
      # 公钥粘进 `src-tauri/src/license.rs`；② 如果这一版本就不打算卖，删掉这一步。
      - name: Refuse to release a build that cannot activate
        run: |
          if grep -q 'pub const PUBLIC_KEY_B64: &str = "";' src-tauri/src/license.rs; then
            echo "::error::PUBLIC_KEY_B64 is empty, so nobody who pays could activate this build. In rocktier.com run 'node tools/license-keygen.mjs', put the private key into Vercel as LICENSE_PRIVATE_KEY, and paste the public key into src-tauri/src/license.rs. If this release is not meant to be sold, delete this step."
            exit 1
          fi
          echo "activation key is configured"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install qpdf + provision the sidecar
        run: |
          brew install qpdf
          bash scripts/provision-qpdf-macos.sh
      # tauri_build::build() hard-fails when a path in bundle.resources is missing,
      # and tauri.conf.json lists resources/qpdf. Without this the workflow dies at
      # cargo check - which is exactly how the v1.0.0 run failed.
      - name: Fetch Pdfium
        run: node scripts/fetch-pdfium.mjs --all
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --bin rocktier-pdf-editor

  build-macos:
    name: macOS (Apple Silicon)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend deps
        run: npm ci

      - name: Provision qpdf sidecar
        run: |
          brew install qpdf
          bash scripts/provision-qpdf-macos.sh
      # tauri_build::build() hard-fails when a path in bundle.resources is missing,
      # and tauri.conf.json lists resources/qpdf. Without this the workflow dies at
      # cargo check - which is exactly how the v1.0.0 run failed.
      - name: Build
        run: npm run tauri:build -- --target aarch64-apple-darwin

      - name: Sign the app bundle, notarize it, and repack the DMG
        env:
          # Add these five as repository secrets and this step switches from ad-hoc
          # to a real Developer ID signature plus notarization, with no other change:
          #   APPLE_CERT_P12       base64 of the Developer ID Application .p12
          #   APPLE_CERT_PASSWORD  its password
          #   APPLE_ID             the Apple ID that owns the certificate
          #   APPLE_TEAM_ID        the 10-character team id
          #   APPLE_APP_PASSWORD   an app-specific password for that Apple ID
          # Without them the behaviour is exactly what it was before: ad-hoc, and
          # Gatekeeper still warns about downloaded copies.
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          # ARM64 macOS refuses to run unadorned binaries, so the linker already
          # ad-hoc signs the executable. The bundle needs a real seal on top - and
          # the DMG needs its copy replaced: tauri packs the image from the still
          # unsigned bundle, so signing the app afterwards cannot reach inside it.
          # A v1.0.10 downloader hit "damaged" exactly there (release.yml used to
          # say so). Replace the bundle inside the image, re-compress, then seal the
          # image itself.
          app=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos \
            -maxdepth 1 -name '*.app' | head -1)
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg \
            -name '*.dmg' | head -1)

          sign_app=(-s -)
          if [ -n "${APPLE_CERT_P12:-}" ]; then
            # Import into a throwaway keychain. `set-key-partition-list` is what
            # lets codesign use the key without an interactive prompt.
            keychain="$RUNNER_TEMP/rocktier-signing.keychain-db"
            echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "" "$keychain"
            security set-keychain-settings -lut 900 "$keychain"
            security unlock-keychain -p "" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
              -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

            identity=$(security find-identity -v -p codesigning "$keychain" \
              | awk '/Developer ID Application/ {print $2; exit}')
            if [ -z "$identity" ]; then
              echo "::error::APPLE_CERT_P12 is set but contains no Developer ID Application identity."
              exit 1
            fi
            echo "signing as $identity"
            # Hardened runtime is required for notarization, and the entitlements
            # file is what lets the bundled Pdfium dylib load at all.
            sign_app=(-s "$identity" --options runtime --entitlements src-tauri/Entitlements.plist)
          else
            echo "::notice::No Developer ID certificate configured - ad-hoc signing. Downloaded copies will still be flagged by Gatekeeper. See PRIVACY.md for the notarization secrets."
          fi

          codesign "${sign_app[@]}" -fv --deep "$app"
          codesign -dvvv "$app" 2>&1 | grep 'Signature=' || true

          work=$(mktemp -d)
          hdiutil convert "$dmg" -format UDRW -o "$work/rw.dmg" -quiet
          mnt="$work/m"
          mkdir -p "$mnt"
          hdiutil attach "$work/rw.dmg" -readwrite -nobrowse -mountpoint "$mnt" -quiet
          rm -rf "$mnt/$(basename "$app")"
          cp -R "$app" "$mnt/"
          hdiutil detach "$mnt" -quiet
          hdiutil convert "$work/rw.dmg" -format UDZO -o "$work/signed.dmg" -quiet
          mv "$work/signed.dmg" "$dmg"
          rm -rf "$work"

          if [ -n "${APPLE_CERT_P12:-}" ]; then
            # Notarize the image (which covers the app inside it), then staple so
            # the ticket travels with the file and Gatekeeper can check offline.
            codesign -s "$identity" -fv "$dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          else
            codesign -s - -fv "$dmg"
          fi
          codesign -dvvv "$dmg" 2>&1 | grep 'Signature=' || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

  build-windows:
    name: Windows (x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          # tauri-windows-bundle builds with an explicit --target, so it has to
          # be present or the MSIX step fails.
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: npm ci

      - name: Provision qpdf sidecar
        # pwsh, not powershell: Windows PowerShell 5.1 reads a BOM-less UTF-8 .ps1
        # as the system codepage, so the Chinese comments swallow the bytes that
        # follow them and the script dies on a bogus "missing closing '}'" error.
        # The script now carries a BOM too, so either caller is safe.
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File scripts/provision-qpdf-windows.ps1

      # tauri_build::build() hard-fails when a path in bundle.resources is missing,
      # and tauri.conf.json lists resources/qpdf. Without this the workflow dies at
      # cargo check - which is exactly how the v1.0.0 run failed.
      - name: Build
        run: npm run tauri:build

      - name: Build MSIX (for Microsoft Store)
        # ROCKTIER_CHANNEL=store turns off the app's own trial and activation
        # entirely: the Store sold this copy and the Store knows it. Leaving our
        # paywall in would pull in Microsoft's third-party-purchase rules (10.8.2)
        # and its disclosure requirements (10.8.4) for no reason.
        #
        # The step above builds msi/nsis with no such variable, so those stay on
        # the default `direct` channel. rustc records option_env! lookups in its
        # dep-info, so changing this variable is enough to force a rebuild.
        env:
          ROCKTIER_CHANNEL: store
        run: npm run tauri:windows:build

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            # tauri-windows-bundle writes to src-tauri/target/msix/, NOT to
            # gen/windows/ — that only holds the inputs. A wrong glob here fails
            # silently: nothing is uploaded and nobody is told.
            src-tauri/target/msix/*.msix*

  release:
    name: Publish release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `gh` resolves which repository to act on from the working directory's git
          # remote. This job only downloads artifacts, so there was no .git here and it
          # died with "fatal: not a git repository" - after all three platform builds
          # had already succeeded. Hence the checkout above; --repo states the target
          # outright as well, so the intent survives any future reshuffle of steps.
          REPO="$GITHUB_REPOSITORY"
          TAG="${GITHUB_REF_NAME}"
          echo "Publishing $TAG to $REPO"
          # The product name contains a space ("Rocktier PDF_1.0.7_x64.msix"), so the
          # list must never be joined into one space-separated string: word splitting
          # cuts every path at "Rocktier" and the upload then looks for files that do
          # not exist. Keep it NUL-delimited on disk and let xargs hand paths over.
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.msix' -o -name '*.msixbundle' \) -print0 > installers.nul
          count=$(tr -cd '\0' < installers.nul | wc -c)
          echo "Found $count installer(s)"
          if [ "$count" -eq 0 ]; then
            echo "No installers were produced - refusing to publish an empty release." >&2
            exit 1
          fi
          tr '\0' '\n' < installers.nul | sed 's/^/  /'

          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes "Automated build for $TAG"
          fi
          # This loop used to swallow its own failure: `cmd && break || sleep` leaves the
          # exit status at 0 when every attempt fails, so the job would report success
          # with nothing attached. Track the outcome and fail loudly instead.
          uploaded=0
          for i in $(seq 1 10); do
            if xargs -0 -r gh release upload "$TAG" --repo "$REPO" --clobber < installers.nul; then
              uploaded=1
              break
            fi
            echo "upload attempt $i failed, retrying"
            sleep 5
          done
          if [ "$uploaded" -ne 1 ]; then
            echo "Uploading to $TAG failed after 10 attempts." >&2
            exit 1
          fi
          echo "Attached $count file(s) to $TAG."
