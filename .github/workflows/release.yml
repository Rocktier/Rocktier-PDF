name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Rust checks
    # macOS, not ubuntu: cargo check/test build the Tauri crate, which on Linux
    # needs glib/gtk/webkit system libraries a bare runner does not have. The
    # family already hit this on the Markdown app's checks job.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Fetch Pdfium
        run: node scripts/fetch-pdfium.mjs --all
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --bin rocktier-pdf-editor

  build-macos:
    name: macOS (Apple Silicon)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend deps
        run: npm ci

      - name: Build
        run: npm run tauri:build -- --target aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

  build-windows:
    name: Windows (x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          # tauri-windows-bundle builds with an explicit --target, so it has to
          # be present or the MSIX step fails.
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: npm ci

      - name: Build
        run: npm run tauri:build

      - name: Build MSIX (for Microsoft Store)
        run: npm run tauri:windows:build

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            # tauri-windows-bundle writes to src-tauri/target/msix/, NOT to
            # gen/windows/ — that only holds the inputs. A wrong glob here fails
            # silently: nothing is uploaded and nobody is told.
            src-tauri/target/msix/*.msix*

  release:
    name: Publish release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "Publishing $TAG"
          files=$(find artifacts -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.msix' -o -name '*.msixbundle' \) | tr '\n' ' ')
          echo "Found: $files"
          if [ -z "$files" ]; then
            echo "No installers were produced - refusing to publish an empty release." >&2
            exit 1
          fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Automated build for $TAG"
          fi
          for i in {1..10}; do
            gh release upload "$TAG" $files --clobber && break || sleep 5
          done
