name: Checks

# Editor 此前**没有任何 CI**（合并前它一直靠手动跑）。压缩能力并进来之后，
# 两条写文件路径（pdfium / qpdf）同处一个应用，没有自动化检查是不可接受的。
# 数字签名并入后，Go 引擎也进同一条流水线：引擎与 Rust 的契约（退出码、
# JSON 字段）改坏了，必须在合并前就红。

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    name: Tests & Lints
    # macOS 而不是 ubuntu：Tauri 在 Linux 上编译需要 glib/gtk 系统库，
    # 裸 runner 会直接失败（Squeeze 那边踩过）。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      # go.mod 的 `go` 指令就是版本来源；不用手写版本号，避免两处漂移。
      - uses: actions/setup-go@v5
        with:
          go-version-file: sign-engine/go.mod
          cache-dependency-path: sign-engine/go.sum
      - name: Install qpdf + frontend deps
        run: |
          brew install qpdf
          npm ci
      - name: Provision qpdf sidecar
        run: bash scripts/provision-qpdf-macos.sh
      - name: Go vet & tests
        working-directory: ./sign-engine
        run: |
          go vet ./...
          go test ./...
      # tauri_build 会在 bundle.resources 缺文件时硬失败；先构建 sidecar，
      # 后面的 cargo test / clippy 才走得通。
      - name: Provision sign-engine sidecar
        run: bash scripts/provision-sign-engine-macos.sh
      - name: Frontend typecheck
        run: npx tsc --noEmit
      - name: Rust tests
        working-directory: ./src-tauri
        run: cargo test --all-targets
      - name: Rust lints
        working-directory: ./src-tauri
        run: cargo clippy --all-targets -- -D warnings
