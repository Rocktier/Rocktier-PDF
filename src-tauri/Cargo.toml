[package]
name = "rocktier-pdf-editor"
version = "1.1.1"
description = "Edit PDFs. Fast, private, no internet needed."
authors = ["Rocktier <hello@rocktier.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "rocktier_pdf_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rocktier-pdf-editor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jpeg-encoder = "0.6"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = "0.9.4"
lopdf = "0.36"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
log = "0.4"
# 授权回执的离线验签（客户端只持公钥）。见 src/license.rs 顶部说明：
# 不用对称密钥 —— 那等于把签发密钥打进每一位用户的机器里。
ed25519-dalek = "2"
# 私钥只进系统安全存储（macOS Keychain / Windows 凭据管理器），不放明文文件。
#
# 注意：keyring 3 **一个默认后端都没有**（docs.rs `crate/keyring/3.6.3/features`
# 写着 "no default features"）。只写 `keyring = "3"` 会静默落到 mock store ——
# `set_password` 返回成功，实际一个字节都没存，直到用户点签名才报「私钥不在
# 钥匙串里」。底层 crate（security-framework / windows-sys）在 keyring 自己的
# 清单里按目标平台门控，两条 feature 同时开不会污染对方平台。
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# 证书条目的 created / 有效期展示。
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
