[package]
name = "rocktier-pdf-editor"
version = "1.0.13"
description = "Edit PDFs. Fast, private, no internet needed."
authors = ["Rocktier <hello@rocktier.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "rocktier_pdf_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rocktier-pdf-editor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jpeg-encoder = "0.6"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = "0.9.4"
lopdf = "0.36"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
log = "0.4"
# 授权回执的离线验签（客户端只持公钥）。见 src/license.rs 顶部说明：
# 不用对称密钥 —— 那等于把签发密钥打进每一位用户的机器里。
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
