[package]
name = "rocktier-pdf-editor"
version = "0.1.0"
description = "Edit PDFs. Fast, private, no internet needed."
authors = ["Rocktier <hello@rocktier.studio>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "rocktier_pdf_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rocktier-pdf-editor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = "0.9.4"
lopdf = "0.36"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
