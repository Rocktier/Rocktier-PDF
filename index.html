<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocktier PDF Editor</title>
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      // 主题必须在第一帧样式解析前定好（2026-11-15 起两态：light ⇄ dark，
      // 取消「跟随系统」）；若等 React 挂载再设，会先画一帧错误主题再跳变。
      (function () {
        try {
          // 2026-10-04：运行时已改读 ""rocktier.theme""（键改名统一命名空间），
          // 这里必须同步，否则老用户会看到「先按旧键画首帧、挂载后跳成另一种」。
          var saved = localStorage.getItem("rocktier.theme") || localStorage.getItem("rocktier-pdf-editor.theme");
          var resolved;
          if (saved === "light" || saved === "dark") {
            resolved = saved;
          } else {
            // 旧存 auto 的按当时系统值一次性落定；从没选过的默认深色。落定后持久化。
            resolved = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
            try { localStorage.setItem("rocktier.theme", resolved); } catch (e2) {}
          }
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
